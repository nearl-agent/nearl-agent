<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/"><!-- the shared footer uses relative links; this keeps them right on any missing path -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · NEARL</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="alternate icon" href="/logo-icon.png?v=2" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>/* fallback if theme.css does not load */html,body{background:#050505;color:#F5F5F0}a{color:#FDFAC3}</style>
<link rel="stylesheet" href="/theme.css?v=13">
<style>
/* 404: served by Netlify for any missing path, so every asset uses an absolute path. */
:root{--logo-mask:url(/logo.svg?v=2)}
.nf{min-height:calc(100vh - 220px);display:grid;place-items:center;text-align:center;padding:48px 0}
.nf .gate{width:180px;height:180px;margin:0 auto 28px;position:relative;display:grid;place-items:center}
.nf .gate svg{position:absolute;inset:0;width:100%;height:100%}
.nf .gate .logo{height:46px}
.nf .code{font:500 13px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.nf h1{font-size:clamp(32px,6vw,56px);margin-top:12px}
.nf p{color:var(--ink-2);max-width:46ch;margin:14px auto 0}
.nf .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.nf .path{font:500 13px var(--f-mono);color:var(--ink-2);margin-top:22px;overflow-wrap:anywhere}
</style>
</head>
<body>
<nav class="topnav">
  <div class="in">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"></span>NEARL</a>
    <div class="links"><a href="/token">$NEARL</a><a href="/check">Check</a><a href="/swap">Swap</a><a href="/guard">Guard</a><a href="/app">Earn</a><a href="/docs">Docs</a></div>
  </div>
</nav>

<main class="wrap nf">
  <div>
    <div class="gate" aria-hidden="true">
      <svg viewBox="0 0 180 180"><polygon points="90,6 163,48 163,132 90,174 17,132 17,48" fill="none" stroke="#FDFAC3" stroke-width="2" opacity=".9"/><polygon points="90,26 146,58 146,122 90,154 34,122 34,58" fill="none" stroke="#FDFAC3" stroke-width="1.5" opacity=".35"/></svg>
      <span class="logo"></span>
    </div>
    <div class="code">404 · Not found</div>
    <h1>This page did not pass the gate.</h1>
    <p>The link may be mistyped, or the page has moved. If someone sent you here with a token address, check it yourself on NEARL Check.</p>
    <div class="acts">
      <a class="btn primary" href="/check">Check a token</a>
      <a class="btn" href="/">Go to the homepage</a>
    </div>
    <div class="path" id="path"></div>
  </div>
</main>

<footer id="site-footer"></footer>
<script>try { document.getElementById("path").textContent = location.pathname; } catch (_) {}</script>
<script src="/footer.js"></script>
</body>
</html>
